<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RASMAN — SVG Sketch Motion Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .loader-wrapper {
      width: min(88vw, 440px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      direction: ltr; /* جلوگیری از به‌هم‌ریختگی در سایت‌های فارسی */
    }

    #rasman-loader {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #rasman-loader.ready {
      opacity: 1;
    }

    .guide-line {
      fill: none;
      stroke: #1a1a1a;
      stroke-width: 0.9;
      stroke-linecap: round;
      opacity: 0.78;
    }

    .main-outline {
      fill: none;
      stroke: #111111;
      stroke-width: 2.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accent-outline {
      fill: none;
      stroke: #111111;
      stroke-width: 1.15;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.75;
    }

    .letter-outline {
      fill: none;
      stroke: #111111;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hatch-stroke {
      fill: none;
      stroke: #161616;
      stroke-linecap: round;
    }

    .subtitle-text {
      font-family: 'Montserrat', 'Century Gothic', 'Futura', sans-serif;
      font-size: 20.5px;
      font-weight: 500;
      fill: #111111;
    }

    .percent-text {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      fill: #111111;
      letter-spacing: 1.4px;
      font-variant-numeric: tabular-nums;
    }

    /* دکمه ظریف برای اجرای مجدد جهت پیش‌نمایش */
    .replay-btn {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      border: 1px solid #d4d4d4;
      color: #444;
      padding: 6px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .replay-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .replay-btn:hover {
      border-color: #111;
      color: #111;
    }
  </style>
</head>

  <script>
    (function () {
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('rasman-loader');
      const outerHatchGroup = document.getElementById('layer-hatch-outer');
      const innerHatchGroup = document.getElementById('layer-hatch-inner');
      const letterHatchGroup = document.getElementById('layer-hatch-letters');
      const progressFill = document.getElementById('progress-fill');
      const progressPercent = document.getElementById('progress-percent');
      const subtitleClipRect = document.getElementById('subtitle-clip-rect');
      const replayBtn = document.getElementById('replay-btn');

      const BAR_MAX_WIDTH = 368; // دقیقاً برابر عرض لوگو (482 - 114)

      // مولد عدد تصادفی ثابت (Seeded) برای طبیعی بودن هاشورهای دست‌کشیده
      let seed = 4219;
      function rand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      function addHatchLine(parent, x1, y1, x2, y2, start, end, width = 0.85, opacity = 0.82) {
        const line = document.createElementNS(SVG_NS, 'line');
        const j = 1.4;
        line.setAttribute('x1', (x1 + (rand() - 0.5) * j).toFixed(1));
        line.setAttribute('y1', (y1 + (rand() - 0.5) * j).toFixed(1));
        line.setAttribute('x2', (x2 + (rand() - 0.5) * j).toFixed(1));
        line.setAttribute('y2', (y2 + (rand() - 0.5) * j).toFixed(1));
        line.setAttribute('class', 'hatch-stroke');
        line.setAttribute('stroke-width', width.toFixed(2));
        line.setAttribute('stroke-opacity', opacity.toFixed(2));
        line.dataset.start = start.toFixed(3);
        line.dataset.end = end.toFixed(3);
        parent.appendChild(line);
      }

      function buildAllHatching() {
        // ۱) هاشور دیواره چپ و سقف چپ بیرونی (مورب /)
        for (let t = 0; t < 44; t++) {
          const p = t / 44;
          const yBase = 165 + t * 7.2;
          const s = 0.42 + p * 0.18;
          addHatchLine(outerHatchGroup, 108, yBase + 22, 168, yBase - 32, s, s + 0.08, 0.85, 0.82);
        }
        // کراس‌هچ روی شانه بالا-چپ بیرونی (مطابق طرح اصلی)
        for (let t = 0; t < 16; t++) {
          const yBase = 158 + t * 6.5;
          const s = 0.48 + (t / 16) * 0.12;
          addHatchLine(outerHatchGroup, 110, yBase - 22, 166, yBase + 26, s, s + 0.08, 0.72, 0.65);
        }

        // ۲) هاشور تاج و سقف راست بیرونی (عمودی متمایل)
        for (let x = 155; x <= 430; x += 6.2) {
          const p = (x - 155) / 275;
          const tilt = x < 283 ? -12 : 11;
          const s = 0.46 + p * 0.22;
          addHatchLine(outerHatchGroup, x, 66, x + tilt, 232, s, s + 0.09, 0.88, 0.84);
        }

        // ۳) هاشور نوار افقی پایین
        for (let x = 128; x <= 346; x += 6.8) {
          const p = (x - 128) / 218;
          const s = 0.54 + p * 0.16;
          addHatchLine(outerHatchGroup, x - 16, 458, x + 22, 418, s, s + 0.08, 0.85, 0.82);
        }
        // کراس‌هچ انحنای پایین-راست به سمت ساقه برگ
        for (let x = 290; x <= 355; x += 6.2) {
          const p = (x - 290) / 65;
          const s = 0.62 + p * 0.12;
          addHatchLine(outerHatchGroup, x - 18, 412, x + 24, 458, s, s + 0.08, 0.78, 0.75);
        }

        // ۴) هاشور برگ (قسمت بالا و ساقه: کراس‌هچ چپ + خطوط نرم سمت نوک)
        for (let y = 295; y <= 415; y += 6.5) {
          const p = (y - 295) / 120;
          const s = 0.64 + p * 0.14;
          addHatchLine(outerHatchGroup, 330, y + 18, 392, y - 28, s, s + 0.08, 0.8, 0.78);
          addHatchLine(outerHatchGroup, 330, y - 16, 390, y + 20, s + 0.04, s + 0.12, 0.72, 0.68);
        }
        // هاشور ظریف رگبرگ‌های بالایی برگ
        for (let x = 390; x <= 476; x += 11) {
          const p = (x - 390) / 86;
          const s = 0.68 + p * 0.12;
          addHatchLine(outerHatchGroup, x, 240, x - 18, 305, s, s + 0.08, 0.75, 0.65);
        }
        // هاشور قسمت پایینی برگ (عمودی و کراس‌هچ در شکم برگ)
        for (let x = 368; x <= 480; x += 6.2) {
          const p = (x - 368) / 112;
          const s = 0.70 + p * 0.14;
          addHatchLine(outerHatchGroup, x + 4, 332, x - 5, 400, s, s + 0.08, 0.82, 0.80);
        }
        for (let y = 342; y <= 394; y += 6.2) {
          const p = (y - 342) / 52;
          const s = 0.73 + p * 0.12;
          addHatchLine(outerHatchGroup, 362, y, 458, y - 6, s, s + 0.08, 0.72, 0.68);
        }
        // رگبرگ‌های افقی ملایم بخش میانی-راست برگ
        for (let y = 278; y <= 338; y += 14) {
          const p = (y - 278) / 60;
          const s = 0.74 + p * 0.10;
          addHatchLine(outerHatchGroup, 412, y, 480, y - 10, s, s + 0.08, 0.7, 0.58);
        }

        // ۵) هاشور خانه داخلی (ستون چپ: کراس‌هچ متراکم)
        for (let y = 248; y <= 392; y += 6.2) {
          const p = (y - 248) / 144;
          const s = 0.50 + p * 0.18;
          addHatchLine(innerHatchGroup, 188, y + 18, 228, y - 18, s, s + 0.08, 0.85, 0.85);
          addHatchLine(innerHatchGroup, 188, y - 18, 228, y + 18, s + 0.03, s + 0.11, 0.82, 0.82);
        }
        // سقف چپ داخلی (هاشورهای عمودی)
        for (let x = 218; x <= 284; x += 6.8) {
          const p = (x - 218) / 66;
          const s = 0.54 + p * 0.12;
          addHatchLine(innerHatchGroup, x, 170, x - 4, 260, s, s + 0.08, 0.82, 0.78);
        }
        // سقف راست داخلی (کراس‌هچ متراکم)
        for (let x = 282; x <= 368; x += 6.2) {
          const p = (x - 282) / 86;
          const s = 0.58 + p * 0.15;
          addHatchLine(innerHatchGroup, x - 16, 180, x + 22, 272, s, s + 0.08, 0.82, 0.82);
          addHatchLine(innerHatchGroup, x + 20, 180, x - 20, 272, s + 0.03, s + 0.11, 0.80, 0.80);
        }

        // ۶) هاشور داخل حروف RASMAN
        for (let x = 112; x <= 488; x += 4.6) {
          const p = (x - 112) / 376;
          const s = 0.72 + p * 0.18;
          addHatchLine(letterHatchGroup, x - 10, 548, x + 12, 500, s, s + 0.08, 0.78, 0.75);
        }
      }

      buildAllHatching();

      // آماده‌سازی تمام مسیرها و خطوط برای انیمیشن stroke-dashoffset
      const drawables = [];
      svg.querySelectorAll('[data-start]').forEach((el) => {
        const length = el.getTotalLength();
        el.style.strokeDasharray = length;
        el.style.strokeDashoffset = length;
        drawables.push({
          el,
          length,
          start: parseFloat(el.dataset.start),
          end: parseFloat(el.dataset.end),
        });
      });

      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      // تابع اصلی کنترل پیشرفت (عدد بین 0 تا 1)
      function renderProgress(progress) {
        const p = clamp(progress, 0, 1);

        // ۱. به‌روزرسانی خطوط اسکیس
        for (let i = 0; i < drawables.length; i++) {
          const item = drawables[i];
          const local = clamp((p - item.start) / (item.end - item.start), 0, 1);
          item.el.style.strokeDashoffset = item.length * (1 - easeOutCubic(local));
        }

        // ۲. نمایش نرم زیرعنوان در فاز پایانی (82% تا 100%)
        const subLocal = clamp((p - 0.82) / 0.18, 0, 1);
        subtitleClipRect.setAttribute('width', (376 * easeOutCubic(subLocal)).toFixed(2));

        // ۳. پر شدن اسلایدر مشکی هم‌عرض لوگو + درصد زیر آن
        progressFill.setAttribute('width', (BAR_MAX_WIDTH * p).toFixed(2));
        progressPercent.textContent = Math.round(p * 100) + '%';
      }

      // اجرای خودکار دمو با منحنی سرعت طبیعی
      let animFrameId = null;
      function runAutoLoader(durationMs = 4200) {
        if (animFrameId) cancelAnimationFrame(animFrameId);
        replayBtn.classList.remove('visible');
        renderProgress(0);
        svg.classList.add('ready');

        const startTime = performance.now();
        function step(now) {
          const raw = clamp((now - startTime) / durationMs, 0, 1);
          // منحنی نرم (Ease-in-out) برای حس طبیعی لودینگ
          const eased = raw < 0.5
            ? 2 * raw * raw
            : 1 - Math.pow(-2 * raw + 2, 2) / 2;

          renderProgress(eased);

          if (raw < 1) {
            animFrameId = requestAnimationFrame(step);
          } else {
            renderProgress(1);
            replayBtn.classList.add('visible');
          }
        }
        animFrameId = requestAnimationFrame(step);
      }

      // API عمومی برای اتصال به درصد لود واقعی وب‌سایت (عدد 0 تا 100)
      window.setRasmanLoaderProgress = function (percent) {
        if (animFrameId) cancelAnimationFrame(animFrameId);
        svg.classList.add('ready');
        renderProgress(percent / 100);
      };

      replayBtn.addEventListener('click', () => runAutoLoader(4200));

      // شروع لودینگ
      runAutoLoader(4200);
    })();
  </script>
</body>
